name: Regenerate Weekly Signal brief (manual)

# Runs ONLY the brief generator. No collectors, no discovery, no proposer, no
# reconcile: it reads the corpus as-is and rebuilds this week's DRAFT so a
# generator change (new draft copy, ranking, exhibit) takes effect without
# waiting for Sunday or re-running the whole weekly pipeline.
#
# Non-destructive by contract. Default run is create-if-absent: any existing
# brief is left untouched. force=true regenerates ONLY a draft (delete +
# rebuild); if the week's brief is PUBLISHED the generator refuses, exits 2,
# and this run goes RED so a brief you have edited and sent can never be
# silently destroyed. Unpublish it at /brief first if you truly want to rebuild.
#
# dry_run=true: selects, clusters, and reports without writing anything to the
# database. Use this to preview brief contents after a lens or corpus change.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview brief selection/clustering without writing to the database"
        type: boolean
        default: false
      force:
        description: "Force regenerate this week's brief (DRAFT only; refuses and fails if it is published)"
        type: boolean
        default: false

concurrency:
  group: regenerate-brief
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The generator is deterministic (no LLM), so only the Supabase creds are
      # needed. dry_run skips all writes; --force is only passed in apply mode.
      - name: Regenerate brief (brief generator only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m src.brief_generator --dry-run
          else
            python -m src.brief_generator --apply ${{ inputs.force && '--force' || '' }}
          fi
