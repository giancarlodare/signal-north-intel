name: Extract backfill (awards + board minutes)

# The LOW-PRIORITY extraction pass, run by hand. The daily collector extracts
# only the forward types (tender_notice / news_release / grant_program) that can
# populate a brief; award_notice and board_minutes are reconciliation and
# backtest fuel, not fresh signal, so they drain here instead of competing with
# the forward path for the daily token budget.
#
# workflow_dispatch only (never scheduled): run it when you want to chip away at
# the captured backlog, at whatever cadence and cap the budget allows. Newest
# event date first, capped per run. Opus 4.8: awards are the reconciliation hard
# key that links a tender to its settling award, and the model comparison showed
# the cheaper model dropping reference numbers and conflating recipient with
# buyer -- exactly the fields that carry that linkage. Idempotent: a run only
# ever advances documents from `captured` to `extracted`/`failed`, so re-running
# never double-extracts.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max documents to extract this run (per-run cost ceiling)"
        type: string
        default: "200"
      # Targeted-drain scope (operator-approved envelopes only): comma-
      # separated url host substrings passed to --include-hosts, and an
      # optional doc_types override. Empty = the standing unscoped drain.
      include_hosts:
        description: "Restrict the run to these url host substrings (targeted drain)"
        type: string
        default: ""
      doc_types:
        description: "Override the doc_types list for a targeted drain"
        type: string
        default: "award_notice,board_minutes,news_release"
      # The declared envelope this batch spends against. The guard below
      # reads it, compares cumulative measured spend to the declared amount,
      # and SKIPS the batch if it would exceed. There is no "no envelope"
      # option: an undeclared spend is what the guard exists to stop.
      envelope:
        description: "Declared envelope key this batch spends against"
        type: string
        required: true

concurrency:
  group: extract-backfill
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # THE BINDING CHECK (operator 2026-07-29). Measurement is not a limit;
      # this is the limit. Three outcomes: PROCEED, SKIP (green, gated below,
      # surfaced), UNMEASURABLE (red, raises). An envelope whose cumulative
      # spend cannot be measured is never certified as having room.
      - name: Envelope guard (pre-dispatch)
        id: guard
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: >
          python -m src.envelope_guard
          --envelope "${{ inputs.envelope }}"
          --planned-docs ${{ inputs.limit }}

      - name: Extract award / board-minutes backlog into signals
        if: steps.guard.outputs.proceed == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EXTRACTION_MODEL: claude-opus-4-8
        # COST GATE (operator 2026-07-27): the tier-2 buyers' award history
        # (~7,440 docs, ~$45) is HELD from the drain until the Toronto+Peel
        # pilot delivers its cost-and-value read and the operator approves
        # historical drains buyer batch by buyer batch. Forward collection
        # is unaffected (the daily capped step handles it). Remove a buyer
        # from this exclusion only with an operator-approved envelope.
        # include-hosts and exclude-buyers are mutually exclusive at the DB
        # client (both compile to PostgREST `or`; run 30370140377 raised on
        # the pair). A targeted drain's host scope subsumes the exclusion --
        # the HELD tier-2 buyers live on hosts a scoped run never selects --
        # so scoped runs pass ONLY the scope and unscoped runs keep the
        # standing exclusion.
        run: >
          python -m src.signal_extractor
          --doc-types "${{ inputs.doc_types }}"
          --newest-first --limit ${{ inputs.limit }}
          --envelope "${{ inputs.envelope }}"
          ${{ inputs.include_hosts != '' && format('--include-hosts "{0}"', inputs.include_hosts) || '--exclude-buyers "City of Hamilton,City of Brampton,City of Kitchener,City of Vaughan,Halton Region"' }}

      # A skip must be visible, not silent. The guard already printed the
      # arithmetic; this puts it on the run summary so a skipped batch reads
      # as a decision rather than as a run that did nothing.
      - name: Surface the skip
        if: steps.guard.outputs.proceed != 'true'
        run: |
          {
            echo "## Batch SKIPPED by the envelope guard"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| envelope | \`${{ inputs.envelope }}\` |"
            echo "| declared | \$${{ steps.guard.outputs.declared_usd }} |"
            echo "| spent to date | \$${{ steps.guard.outputs.spent_usd }} |"
            echo "| this batch would add | \$${{ steps.guard.outputs.projected_usd }} |"
            echo "| docs the envelope still affords | ${{ steps.guard.outputs.docs_affordable }} |"
            echo ""
            echo "Lower the cap to the affordable count, or bring the operator a new envelope."
          } >> "$GITHUB_STEP_SUMMARY"
