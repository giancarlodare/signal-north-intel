name: Day-2 member email

# Sends the "your first brief arrives Monday" email to paid members who joined
# 24-48h ago and have not yet received it. The day2_sent flag on user_metadata
# ensures idempotency; a manual dispatch is safe to re-run.
#
# Dual-UTC cron + Eastern hour guard (same pattern as weekly-discovery): both
# crons fire around 9am Eastern, the guard passes whichever one is actually 9am.
# workflow_dispatch bypasses the guard for manual runs.

on:
  schedule:
    - cron: "0 13 * * *"  # 9am EDT (UTC-4)
    - cron: "0 14 * * *"  # 9am EST (UTC-5)
  workflow_dispatch: {}

concurrency:
  group: day2-email
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check whether it's actually 9am Eastern right now
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour=$(TZ="America/Toronto" date +%H)
          if [ "$hour" = "09" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: it is ${hour}:00 in America/Toronto, not 09:00."
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.should_run == 'true'

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.should_run == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        if: steps.guard.outputs.should_run == 'true'
        run: npm ci

      - name: Send Day-2 emails
        if: steps.guard.outputs.should_run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SITE_URL: "https://signalnorthintel.com"
        run: node scripts/ci/send-day2-emails.mjs
