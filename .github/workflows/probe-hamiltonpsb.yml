name: Probe Hamilton PSB (search submission)

# Expands the Hamilton HPSB search panel, submits the form, captures the
# resulting XHR + DOM changes to identify the meeting-data endpoint and
# confirm whether document links are visible in the rendered result.
# Never writes to the database.

on:
  workflow_dispatch: {}

concurrency:
  group: probe-hamiltonpsb
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Probe Hamilton PSB search
        run: python scripts/probe_hamilton_search.py

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hamilton-search-findings
          path: |
            hamilton_search_findings.json
            hamilton_after_expand.png
            hamilton_after_search.png
            hamilton_meeting_detail.png
          if-no-files-found: warn
