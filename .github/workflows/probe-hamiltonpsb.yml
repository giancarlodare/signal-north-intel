name: Probe Hamilton PSB (agendas-and-minutes)

# Probes hamiltonpsb.ca/meetings/agendas-and-minutes/ to determine whether
# agendas and minutes are hosted as direct PDFs (London pattern, no render
# adapter needed) or link out to the eScribe JS-shell.
# Reports: robots status, PDF link count, eScribe link count, HEAD check
# results on up to 5 PDFs, and a plain-English verdict.
# Never writes to the database.

on:
  workflow_dispatch: {}

concurrency:
  group: probe-hamiltonpsb
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Probe Hamilton PSB agendas-and-minutes
        run: python scripts/probe_hamilton_agendas_minutes.py

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hamilton-agendas-minutes-findings
          path: |
            hamilton_agendas_minutes_findings.json
            hamilton_agendas_minutes.png
          if-no-files-found: warn
