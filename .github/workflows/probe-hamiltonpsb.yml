name: Probe Hamilton PSB (media URL pattern)

# Fetches the publicly-accessible policies page to extract /media/... URL
# structure, HEADs a sample to confirm public access, checks sitemap.xml for
# agenda/minutes entries, and scans the meetings page source for embedded media
# references. Determines whether meeting agenda PDFs are directly reachable
# without navigating the auth-gated listing page.
# Never writes to the database.

on:
  workflow_dispatch: {}

concurrency:
  group: probe-hamiltonpsb
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Probe Hamilton PSB media URLs
        run: python scripts/probe_hamilton_media.py

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hamilton-media-findings
          path: hamilton_media_findings.json
          if-no-files-found: warn
