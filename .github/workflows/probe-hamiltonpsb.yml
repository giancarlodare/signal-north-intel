name: Probe Hamilton PSB (interaction discovery)

# Renders hamiltonpsb.ca/meetings/agendas-and-materials/ with Playwright,
# simulates scroll / click / select interactions, and dumps XHR requests,
# DOM snapshots, and meeting-link candidates to identify what triggers the
# Umbraco listing to load. Never writes to the database.

on:
  workflow_dispatch: {}

concurrency:
  group: probe-hamiltonpsb
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Probe Hamilton PSB interactions
        run: python scripts/probe_hamilton_interactions.py

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hamilton-interaction-findings
          path: |
            hamilton_interaction_findings.json
            hamilton_final_state.png
          if-no-files-found: warn
