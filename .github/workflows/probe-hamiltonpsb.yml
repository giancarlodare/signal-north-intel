name: Probe Hamilton PSB (media-url-pattern)

# Probes hamiltonpsb.ca /media/... URL pattern to determine whether
# agenda/minutes documents are publicly accessible without auth.
# Reports: media URL pattern (ID type + range), HEAD results on sample URLs,
# sitemap entries, meetings-page media refs, Umbraco API endpoints, verdict.
# Never writes to the database.

on:
  workflow_dispatch: {}

concurrency:
  group: probe-hamiltonpsb
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Probe Hamilton PSB media URL pattern
        run: python scripts/probe_hamilton_media.py

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hamilton-media-findings
          path: hamilton_media_findings.json
          if-no-files-found: warn
